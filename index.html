<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light only">
<title>Garden Calendar | Tepa Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Athiti:wght@400;500&family=Belleza&family=Hanken+Grotesk:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --white:#f5f4f0;--beige:#e6e1d6;--maroon:#330f0f;--plum:#734040;--red:#740b1b;--olive:#6c6947;--green:#485f2e;
  --tan:#cfc0aa;--sand:#e2d9c6;
  --sm:clamp(12px,.9vw,14px);--base:clamp(14px,1.05vw,16px);--lg:clamp(16px,1.2vw,18px);--xl:clamp(18px,1.5vw,22px);--x2:clamp(20px,1.9vw,28px);--x3:clamp(24px,3vw,44px);
  --classic:"Classico URW","Classico",Optima,"Belleza","Athiti",sans-serif;
  --body:"Akkurat","Hanken Grotesk","Athiti",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light;background:var(--beige)}
body{background:var(--beige);color:var(--maroon);font-family:var(--body);font-size:var(--base);font-weight:400;letter-spacing:.2px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,.classic{font-family:var(--classic);font-weight:400;letter-spacing:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
.sm{font-size:var(--sm)}.plum{color:var(--plum)}.it{font-family:"Simula","Instrument Serif",serif;font-style:italic}
.wrap{max-width:1305px;margin:0 auto;padding:0 24px}
.fi{animation:fi .7s ease-in-out both}
@keyframes fi{from{opacity:0}to{opacity:1}}

header{position:sticky;top:0;z-index:30;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:linear-gradient(rgba(230,225,214,.94),rgba(230,225,214,0))}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;height:104px}
header .logo{width:150px;height:63px;display:block;color:var(--red);flex:none}
nav{display:flex;gap:clamp(16px,3vw,44px);font-size:clamp(15px,1.5vw,20px)}
.hd-r{font-size:clamp(15px,1.5vw,20px);white-space:nowrap}
.ul{position:relative;display:inline-block;padding-bottom:2px;white-space:nowrap}
.ul:after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s ease-in-out}
.ul:hover:after,.ul.on:after{transform:scaleX(1)}
.burger{display:none;line-height:0}
.mob{display:none}
@media(max-width:759px){
  header .wrap{height:76px;display:grid;grid-template-columns:1fr auto 1fr}
  header .logo{width:104px;height:44px}
  nav{display:none}.burger{display:block;justify-self:start}.hd-r{justify-self:end;font-size:var(--sm)}
  .mob{position:fixed;inset:0;background:#e5d2be;z-index:40;padding:28px 24px;flex-direction:column;gap:26px;font-family:var(--classic);font-size:28px}
  .mob.open{display:flex}
  .mob button{align-self:flex-end;font-size:26px;line-height:1}
}
.btn{display:inline-block;border:1px solid var(--maroon);padding:8px 14px;font-size:var(--sm);transition:all .3s ease-in-out;background:transparent;white-space:nowrap}
.btn:hover,.btn.on{background:var(--red);border-color:var(--red);color:var(--beige)}
.link{font-size:var(--sm);border-bottom:1px solid currentColor;padding-bottom:1px}
.link:hover{color:var(--red)}

.title{text-align:center;padding:30px 0 10px}
.title .eyebrow{font-family:var(--classic);letter-spacing:.34em;font-size:var(--sm);color:var(--red);margin-bottom:14px}
.title h1{font-size:var(--x3);line-height:1.15}
.title p{margin-top:10px;color:var(--plum)}
.months{display:flex;justify-content:center;align-items:center;gap:26px;margin:30px 0 22px}
.months h2{font-size:var(--x2);min-width:190px;text-align:center}
.arrow{width:38px;height:38px;border:1px solid var(--maroon);display:grid;place-items:center;transition:all .3s}
.arrow:hover{background:var(--red);border-color:var(--red);color:var(--beige)}
.arrow svg{width:19px}.arrow.next svg{transform:scaleX(-1)}
.strip{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 20px;font-size:var(--sm);margin-bottom:30px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:var(--sm);color:var(--plum);padding-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--maroon)}
.cell{min-height:128px;padding:12px 10px 16px 0;border-bottom:1px solid rgba(51,15,15,.25);min-width:0}
.cell .d{font-family:var(--classic);font-size:var(--lg)}
.cell.today .d{color:var(--red);border-bottom:1px solid var(--red);display:inline-block}
.ev{display:block;margin-top:10px;font-size:var(--sm);line-height:1.35;transition:color .3s}
.ev b{font-weight:400;font-family:var(--classic);font-size:var(--base);display:block}
.ev:hover{color:var(--red)}
.ev.done{opacity:.45}
.closed{text-align:center;padding:90px 0;border-top:1px solid var(--maroon);border-bottom:1px solid rgba(51,15,15,.25)}
.closed h3{font-size:var(--x2)}
.list{display:none;border-top:1px solid var(--maroon)}
.row{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid rgba(51,15,15,.25)}
.row .d{font-family:var(--classic);font-size:var(--xl);line-height:1.1}
@media(max-width:699px){.grid,.dow{display:none}.list{display:block}.months{gap:12px}.months h2{min-width:150px}.strip{display:none}}
.foot{padding:60px 0 150px;text-align:center;color:var(--red);font-family:var(--classic);letter-spacing:.34em;font-size:var(--sm)}

/* tiles and cards (as on the ingredient page) */
.ic{width:43px;height:43px;border-radius:8px;background:var(--beige);display:grid;place-items:center;flex:none;color:var(--maroon)}
.ic svg{width:20px;height:20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:44px}
@media(max-width:1099px){.cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:759px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:459px){.cards{grid-template-columns:1fr}}
.tcard{background:#fff;border-radius:14px;padding:18px;display:block;width:100%;transition:background .3s ease-in-out}
.tcard:hover{background:var(--white)}
.tcard h3{font-size:var(--lg);margin-top:26px}
.tcard.on{outline:1px solid var(--red)}
.tcard.on .ic{background:var(--red);color:var(--beige)}
.centre{text-align:center;margin-top:44px}

.detail{background:var(--white);min-height:100vh}
.panel{position:relative;background:var(--red);color:var(--white);padding:104px 24px 30px;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end}
.panel h1{font-size:var(--x3);line-height:1.12}
.panel p{margin-top:8px;font-size:var(--base)}
.panel .eyebrow{font-family:var(--classic);letter-spacing:.34em;font-size:var(--sm);margin-bottom:14px}
.detail header{position:absolute;left:0;right:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--white)}
.detail header .logo{color:var(--white)}
.pane{padding:26px 24px 170px}
.back{display:inline-flex;align-items:center;gap:10px;font-size:var(--sm);margin-bottom:22px}
.back svg{width:19px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;min-width:0}
.tile label{display:block;font-size:var(--sm)}
.tile input{border:0;background:transparent;color:var(--plum);font-size:var(--sm);width:100%;outline:0;padding:0}
.card{background:#fff;border-radius:14px;padding:26px;margin-top:12px}
.card h2{font-size:var(--xl);margin-bottom:18px}
.f{margin-bottom:26px}.f:last-child{margin-bottom:0}
.f label{display:block;font-size:var(--sm);margin-bottom:4px}
.f textarea,.f input[type=text]{width:100%;border:0;border-bottom:1px solid transparent;background:transparent;resize:none;outline:0;font-size:var(--base);line-height:1.5;overflow:hidden;color:var(--plum)}
.f textarea:hover,.f textarea:focus,.f input:focus,.f input:hover{border-bottom-color:var(--tan)}
::placeholder{color:#b9aa9c}
@media(min-width:900px){
  .panel{position:fixed;left:0;top:0;width:42%;height:100vh;padding:40px}
  .pane{margin-left:42%;padding:40px 40px 170px}
  .detail header{width:42%;right:auto}
  .detail header nav,.detail header .hd-r{display:none}
  .detail header .wrap{padding:0 40px}
  .detail .bar{left:71%;max-width:calc(58vw - 24px)}
}
.line{display:grid;grid-template-columns:22px 1fr 22px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid rgba(51,15,15,.14)}
.line:first-of-type{border-top:0}
.line.buy{grid-template-columns:22px 1fr 60px 86px 22px}
.line.mk{grid-template-columns:1fr 22px}
.line .p,.line .s{grid-column:2;max-width:220px}.line.mk .p,.line.mk .s{grid-column:1}
@media(min-width:601px){.line:not(.buy){grid-template-columns:22px 1fr 1fr 22px}.line:not(.buy)>input[type=text]{grid-column:2/4}.line .p{grid-column:2}.line .s{grid-column:3}.line.mk{grid-template-columns:1fr 1fr 22px}.line.mk>input[type=text]{grid-column:1/3}.line.mk .p{grid-column:1}.line.mk .s{grid-column:2}.line:not(.buy) .x{grid-row:1;grid-column:-2}}
.line input[type=text]{border:0;background:transparent;outline:0;width:100%;font-size:var(--base);border-bottom:1px solid transparent;min-width:0}
.line input:focus{border-bottom-color:var(--tan)}
select{border:1px solid rgba(51,15,15,.3);background:transparent;padding:6px;font-size:var(--sm);width:100%;border-radius:0;outline:0}
.line.is-done input[type=text]{color:#a39489;text-decoration:line-through}
.x{color:#b9aa9c;font-size:18px;line-height:1}.x:hover{color:var(--red)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1px solid var(--maroon);display:inline-grid;place-items:center;cursor:pointer;flex:none;background:transparent}
input[type=checkbox]:checked{background:var(--red);border-color:var(--red)}
input[type=checkbox]:checked:after{content:"";width:9px;height:5px;border-left:1.5px solid var(--beige);border-bottom:1.5px solid var(--beige);transform:rotate(-45deg) translateY(-1px)}
.st-prog{background:#efe2c8}.st-done{background:#dfe5d3}.st-stuck{background:#ecd3d1}
.add{margin-top:16px}
.hint{font-size:var(--sm);color:var(--plum);margin-top:14px}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sets .tcard{background:var(--white);padding:14px}
.sets .tcard h3{margin-top:16px;font-size:var(--base)}
@media(max-width:520px){.sets{grid-template-columns:repeat(2,1fr)}.line.buy{grid-template-columns:22px 1fr 44px 70px 22px}}
.check{display:flex;gap:12px;align-items:center;padding:9px 0}
.tot{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid rgba(51,15,15,.14)}
.tot:first-of-type{border-top:0}
.tot.big{font-family:var(--classic);font-size:var(--xl)}
.chips{display:flex;flex-wrap:wrap;gap:10px}

.bar{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:35;display:flex;gap:14px;padding:14px;border-radius:14px;background:rgba(104,87,87,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar button{border:1px solid var(--beige);color:var(--white);font-size:14px;padding:8px 14px;white-space:nowrap;transition:all .3s ease-in-out}
.bar button:hover{background:rgba(255,255,255,.15)}
.bar button.on{background:rgba(255,255,255,.3);border-color:transparent}
@media(max-width:600px){.bar{bottom:14px;gap:8px;padding:10px}}

/* projection */
.plans{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:34px 0 8px}
.ptable{width:100%;border-collapse:collapse;margin-top:6px}
.ptable th{font-weight:400;font-size:var(--sm);color:var(--plum);text-align:right;padding:8px 6px;border-bottom:1px solid var(--maroon);vertical-align:bottom;line-height:1.25}
.ptable th:first-child,.ptable td:first-child{text-align:left;padding-left:0}
.ptable td{padding:8px 6px;border-bottom:1px solid rgba(51,15,15,.14);text-align:right;white-space:nowrap}
.ptable input{border:0;border-bottom:1px solid var(--tan);background:transparent;outline:0;width:100%;text-align:right;padding:4px 0;min-width:0}
.ptable td:first-child input{text-align:left;font-family:var(--classic);font-size:var(--lg);min-width:150px}
.ptable input:focus{border-bottom-color:var(--red)}
.ptable .n{width:9%}
.scroll{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
@media(max-width:759px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border-radius:14px;padding:16px}
.kpi b{display:block;font-weight:400;font-family:var(--classic);font-size:var(--x2);line-height:1.2;margin-top:6px}
.cmp{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:0}
.cmp>div{padding:11px 6px;border-top:1px solid rgba(51,15,15,.14);text-align:right}
.cmp>div:nth-child(4n+1){text-align:left;padding-left:0;color:var(--plum);font-size:var(--sm)}
.cmp>.h{border-top:0;font-family:var(--classic);font-size:var(--lg)}
.neg{color:var(--red)}
.band{background:var(--olive);color:var(--white);border-radius:14px;padding:26px;margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.band div{border-left:1px solid rgba(245,244,240,.5);padding-left:16px}
.band h3{font-size:var(--xl);margin-bottom:6px}
.band p{font-size:var(--sm);line-height:1.6}
@media(max-width:759px){.band{grid-template-columns:1fr}}

.veil{position:fixed;inset:0;background:rgba(32,29,26,.45);z-index:50;display:grid;place-items:center;padding:20px}
.dlg{background:var(--white);border-radius:14px;padding:30px;width:100%;max-width:420px}
.dlg h2{font-size:var(--x2);margin-bottom:20px}
.dlg label{display:block;font-size:var(--sm);margin:14px 0 6px}
.dlg input{width:100%;border:1px solid rgba(51,15,15,.3);background:transparent;padding:9px 10px;border-radius:0;outline:0}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
</style>
</head>

<div id="app"></div>
<script>
const ICONS={"arrow-left-dark": "<svg width=\"19\" height=\"11\" viewBox=\"0 0 19 11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 5.5H1M5.1 1.2.8 5.5l4.3 4.3\"/></svg>", "menu-dark": "<svg width=\"32\" height=\"17\" viewBox=\"0 0 32 17\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"square\"><path d=\"M.75 1.5h30M.75 8.5h30M.75 15.5h30\"/></svg>", "grower": "<svg width=\"21\" height=\"16\" viewBox=\"0 0 21 16\" fill=\"currentColor\"><path d=\"M20.5746 1.19861C18.7984 0.350061 16.7505 0.271018 14.9135 0.980608C13.0766 1.69106 11.6139 3.12672 10.8695 4.94986C10.1252 3.12683 8.66262 1.69121 6.82559 0.980608C4.98866 0.271025 2.9406 0.350068 1.16454 1.19861C0.971722 1.2898 0.852745 1.48783 0.864018 1.70148C0.979531 3.94669 2.14335 6.00669 4.00727 7.26448C5.87112 8.52209 8.21709 8.8313 10.3422 8.09826V14.9726C10.3422 15.2636 10.5785 15.4998 10.8694 15.4998C11.1604 15.4998 11.3966 15.2636 11.3966 14.9726V8.09826C13.5219 8.83043 15.8677 8.52122 17.7307 7.26361C19.5946 6.006 20.7583 3.94582 20.8749 1.7015C20.8861 1.48784 20.7674 1.28979 20.5746 1.19861Z\"/></svg>", "seasonality": "<svg width=\"20\" height=\"21\" viewBox=\"0 0 20 21\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M5.1.5h1.6v1.5h2.4V.5h1.6v1.5h2.4V.5h1.5v1.5h.8a4 4 0 0 1 4 4v10.6a4 4 0 0 1-4 4H4.3a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4h.8V.5ZM2 7.4h15.8V6a2.3 2.3 0 0 0-2.4-2.4H4.3A2.3 2.3 0 0 0 2 6v1.4Z\"/></svg>", "category": "<svg width=\"19\" height=\"19\" viewBox=\"0 0 19 19\" fill=\"currentColor\"><path d=\"M2.94 8.58H7.8c.36 0 .65-.29.65-.65V3.07A2.57 2.57 0 0 0 5.88.5H2.94A2.57 2.57 0 0 0 .37 3.07V6a2.57 2.57 0 0 0 2.57 2.58ZM15.8.5h-2.93a2.57 2.57 0 0 0-2.57 2.57v4.86c0 .36.28.65.64.65h4.86A2.57 2.57 0 0 0 18.37 6V3.07A2.57 2.57 0 0 0 15.8.5ZM2.94 18.5h2.94a2.57 2.57 0 0 0 2.57-2.57v-4.86a.64.64 0 0 0-.65-.64H2.94a2.57 2.57 0 0 0-2.57 2.57v2.93a2.57 2.57 0 0 0 2.57 2.57ZM15.8 10.43h-4.86a.64.64 0 0 0-.64.64v4.86a2.57 2.57 0 0 0 2.57 2.57h2.93a2.57 2.57 0 0 0 2.57-2.57V13a2.57 2.57 0 0 0-2.57-2.57Z\"/></svg>", "family": "<svg width=\"22\" height=\"20\" viewBox=\"0 0 22 20\" fill=\"currentColor\"><circle cx=\"10.87\" cy=\"5\" r=\"4.5\"/><circle cx=\"16.87\" cy=\"15\" r=\"4.5\"/><circle cx=\"4.87\" cy=\"15\" r=\"4.5\"/></svg>", "drop": "<svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"currentColor\"><path d=\"M10 1.5c3 3.6 5.5 6.5 5.5 9.9a5.5 5.5 0 0 1-11 0C4.5 8 7 5.1 10 1.5Z\"/></svg>", "jar": "<svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"currentColor\"><path d=\"M6 1.5h8V4H6zM5 5.5h10A1.5 1.5 0 0 1 16.500 7v9.5a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2V7A1.500 1.500 0 0 1 5 5.500Z\"/></svg>", "plate": "<svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M10 1.500a8.500 8.500 0 1 1 0 17 8.500 8.500 0 0 1 0-17Zm0 2.800a5.700 5.700 0 1 0 0 11.400 5.700 5.700 0 0 0 0-11.400Z\"/><circle cx=\"10\" cy=\"10\" r=\"3.600\"/></svg>", "bucket": "<svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"currentColor\"><path d=\"M2 3h16v1.800H2zM3 6.300h14L15.400 17a1.800 1.800 0 0 1-1.800 1.500H6.400A1.800 1.800 0 0 1 4.600 17L3 6.300Z\"/></svg>", "cup": "<svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"currentColor\"><path d=\"M2.500 5h12v5a6 6 0 0 1-12 0V5ZM15.500 6h1a2.500 2.500 0 0 1 0 5h-1V9.400h1a.900.900 0 0 0 0-1.800h-1V6ZM3 17h11v1.600H3z\"/></svg>", "pot": "<svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"currentColor\"><path d=\"M8.500 2h3v1.800h-3zM2 4.800h16v1.800H2zM3 8h14v6.500a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V8Z\"/></svg>", "print": "<svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M2.500 2.500h10v10h-10zM7.500 7.500h10v10h-10z\"/></svg>", "moon": "<svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"currentColor\"><path d=\"M16.800 12.600A7.600 7.600 0 0 1 7.400 3.200a8 8 0 1 0 9.400 9.400Z\"     for(let d=1;d<=31;d++){const x=new Date(YEAR,m,d); if(x.getMonth()!==m)break; const w=x.getDay(); if(w===6)sat.push(x); if(w===5)fri.push(x);}
    [sat[0],sat[2]].forEach(x=>{if(!x)return;const t=THEMES[th++%THEMES.length];E.push(fromTpl('g101',iso(x),{name:'Gardening 101: '+t[0],series:'Gardening 101',purpose:t[1],takehome:t[2]}))});
    if(fri[2])E.push(fromTpl('tea',iso(fri[2])));
    const s=SERIES[m]; if(s) s.w.forEach((w,i)=>{const x=[sat[1],sat[3]][i]; if(x){const o={name:w[1],price:w[2],series:s.name,purpose:w[3],takehome:w[4]};if(w[2]==='Free')o.buy=[];E.push(fromTpl(w[0],iso(x),o))}});
    if(m===0){
      E.push(fromTpl('other','2027-01-10',{name:'Singapore School Visit',time:'Time tbc',purpose:'Show visiting students how a restaurant garden works.',audience:'School group from Singapore.'}));
      E.push(fromTpl('other','2027-01-28',{name:"Shannon's New York Farmer Friends",time:'Time tbc',purpose:'Host visiting farmers and swap ideas on urban growing.',audience:'Farmer friends of Shannon, from New York.'}));
      ['2027-01-30','2027-01-31'].forEach(d=>E.push(fromTpl('other',d,{name:'Farmers Market',time:'Time tbc',series:'ReWaste',purpose:'Bring growers and makers into the garden and close the ReWaste month.',audience:'Neighbours, Baan Tepa guests and local growers.'})));}
  }
  return E;
}

/* ---------- state ---------- */
const KEY='tepa-garden-v2';
let S={seq:1,TPL:clone(TPL0),SET:clone(SETS0),EV:[],PROJ:clone(PROJ0),open:10};
let saved=null; try{saved=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(saved&&saved.EV&&saved.PROJ){S=saved}else{S.EV=seed()}
let saveT; function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},250)}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=iso(new Date());
const isDone=e=>e.date<today;
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const nice=s=>{const d=pd(s);return DOW[(d.getDay()+6)%7]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()};
const num=s=>{const n=parseFloat(String(s).replace(/,/g,''));return isNaN(n)?0:n};
const fmt=n=>Math.round(n).toLocaleString('en-GB');
const baht=n=>fmt(n)+' THB';
const money=p=>/\d/.test(p)?p+' THB':p;

/* ---------- routing (works without relying on the address bar) ---------- */
let HASH='/calendar'; try{if(location.hash.length>2)HASH=location.hash.slice(1)}catch(e){}
function route(){const h=HASH.replace(/^\/?/,'').split('/');return{page:h[0]||'calendar',a:h[1],b:h[2]}}
function setHash(h){HASH=h;try{history.replaceState(null,'','#'+h)}catch(e){}}
function go(h){setHash(h);render();try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener('hashchange',()=>{let h='';try{h=location.hash.slice(1)}catch(e){}if(h&&h!==HASH){HASH=h;render()}});

/* ---------- pieces ---------- */
const NAV=[['calendar','Calendar'],['templates','Templates'],['mise','Mise en place'],['projection','Projection']];
function header(p){
  return `<header><div class="wrap">
   <button class="burger" data-act="menu" aria-label="Menu">${IC('menu-dark')}</button>
   <a href="#/calendar" aria-label="Calendar">${LOGO}</a>
   <nav>${NAV.map(l=>`<a class="ul ${p===l[0]?'on':''}" href="#/${l[0]}">${l[1]}</a>`).join('')}</nav>
   <a class="ul hd-r" href="#/templates">New event</a>
  </div></header>
  <div class="mob" id="mob"><button data-act="menu" aria-label="Close">&times;</button>${NAV.map(l=>`<a href="#/${l[0]}">${l[1]}</a>`).join('')}</div>`}
const opts=(list,v,blank)=>(blank?`<option value="">${blank}</option>`:'')+list.map(o=>{const[k,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(k)}" ${k===v?'selected':''}>${esc(l)}</option>`}).join('');
function evLink(e){return`<a class="ev ${isDone(e)?'done':''}" href="#/event/${e.id}"><span class="plum">${esc(isDone(e)?'Completed':(e.time||'Time tbc'))}</span><b>${esc(e.name)}</b></a>`}
const head=(t,p)=>`<div class="title"><div class="eyebrow">TEPA GARDEN</div><h1>${t}</h1><p>${p}</p></div>`;

function calendar(r){
  let m=parseInt(r.a,10); if(isNaN(m)||m<0||m>11) m=(new Date().getFullYear()===YEAR?new Date().getMonth():0);
  const first=new Date(YEAR,m,1), lead=(first.getDay()+6)%7, days=new Date(YEAR,m+1,0).getDate();
  const by={}; S.EV.forEach(e=>{(by[e.date]=by[e.date]||[]).push(e)});
  const any=S.EV.some(e=>e.date.slice(0,7)===YEAR+'-'+String(m+1).padStart(2,'0'));
  let cells='',rows='';
  for(let i=0;i<lead;i++)cells+='<div class="cell"></div>';
  for(let d=1;d<=days;d++){const k=iso(new Date(YEAR,m,d)),ev=(by[k]||[]);
    cells+=`<div class="cell ${k===today?'today':''}"><span class="d">${d}</span>${ev.map(evLink).join('')}</div>`;
    if(ev.length)rows+=`<div class="row"><div><div class="d">${d}</div><div class="sm plum">${DOW[(new Date(YEAR,m,d).getDay()+6)%7]}</div></div><div>${ev.map(evLink).join('')}</div></div>`}
  const s=SERIES[m];
  return header('calendar')+`<main class="wrap fi">
   ${head('Garden Calendar '+YEAR,'A living garden for growing, learning and gathering.')}
   <div class="months"><a class="arrow" href="#/calendar/${(m+11)%12}" aria-label="Previous month">${IC('arrow-left-dark')}</a>
     <h2>${MONTHS[m]}</h2>
     <a class="arrow next" href="#/calendar/${(m+1)%12}" aria-label="Next month">${IC('arrow-left-dark')}</a></div>
   <div class="strip">${MONTHS.map((n,i)=>`<a class="ul ${i===m?'on':''}" href="#/calendar/${i}">${n.slice(0,3)}</a>`).join('')}</div>
   ${s&&any?`<p class="centre" style="margin:-4px 0 28px"><span class="sm plum">This month's series</span><br><span class="classic" style="font-size:var(--xl)">${esc(s.name)}</span></p>`:''}
   ${!any&&CLOSED.includes(m)?`<div class="closed"><h3>The garden is resting</h3><p class="plum" style="margin-top:8px">Closed for product development.</p><p style="margin-top:22px"><a class="btn" href="#/templates">Add an event</a></p></div>`:
   `<div class="dow">${DOW.map(d=>`<span>${d}</span>`).join('')}</div><div class="grid">${cells}</div><div class="list">${rows||'<p class="hint" style="padding:30px 0">No events this month.</p>'}</div>`}
   <div class="foot">TEPA GARDEN</div>
  </main>`}

function templates(){
  return header('templates')+`<main class="wrap fi">${head('Templates','Choose a template to add an event to the calendar.')}
   <div class="cards">${S.TPL.map(t=>`<button class="tcard" data-act="new" data-id="${t.id}"><div class="ic">${IC(t.icon)}</div><h3>${esc(t.name)}</h3><p class="sm">${esc(t.kind)}</p><p class="sm plum">${esc([t.time,t.price&&money(t.price)].filter(Boolean).join(' · ')||'Details tbc')}</p></button>`).join('')}</div>
   <div class="foot">TEPA GARDEN</div></main>`}

function mise(r){
  const s=S.SET.find(x=>x.id===r.a);
  if(s) return `<div class="detail fi">${header('mise')}<div class="panel"><div class="eyebrow">MISE EN PLACE</div><h1>${esc(s.name)}</h1><p>${esc(s.note)}</p></div>
   <div class="pane"><a class="back" href="#/mise">${IC('arrow-left-dark')}Back</a>
    <div class="card"><div class="f"><label>Name</label><input type="text" data-set="${s.id}" data-k="name" value="${esc(s.name)}"></div><div class="f"><label>What it is for</label><input type="text" data-set="${s.id}" data-k="note" value="${esc(s.note)}" placeholder="Not stated"></div></div>
    <div class="card"><h2>Items</h2>${s.items.map((it,i)=>`<div class="line" style="grid-template-columns:1fr 22px"><input type="text" style="grid-column:1" data-setitem="${s.id}" data-i="${i}" value="${esc(it)}"><button class="x" data-act="delitem" data-id="${s.id}" data-i="${i}" aria-label="Remove">&times;</button></div>`).join('')||'<p class="hint" style="margin-top:0">No items listed yet.</p>'}
     <button class="btn add" data-act="additem" data-id="${s.id}">Add item</button></div>
    <p class="hint">Changes here apply to every event that uses this set.</p></div></div>`;
  return header('mise')+`<main class="wrap fi">${head('Mise en place','Everything in its place before guests arrive. Sets can be added to any event.')}
   <div class="cards">${S.SET.map(s=>`<a class="tcard" href="#/mise/${s.id}"><div class="ic">${IC(s.icon)}</div><h3>${esc(s.name)}</h3><p class="sm">${esc(s.note)}</p><p class="sm plum">${s.items.length} items</p></a>`).join('')}</div>
   <div class="centre"><button class="btn" data-act="newset">Add a set</button></div><div class="foot">TEPA GARDEN</div></main>`}

/* projection */
function calc(rows){let inc=0,cost=0,hrs=0,ses=0;rows.forEach(r=>{const g=num(r.guests),n=num(r.per);inc+=num(r.price)*g*n;cost+=(num(r.cpg)*g+num(r.fixed))*n;hrs+=num(r.hrs)*n;ses+=n});return{inc,cost,profit:inc-cost,hrs,ses,perhr:hrs?(inc-cost)/hrs:0}}
const rowProfit=r=>((num(r.price)-num(r.cpg))*num(r.guests)-num(r.fixed))*num(r.per);
const signed=n=>`<span class="${n<0?'neg':''}">${fmt(n)}</span>`;
function projBody(plan){const rows=S.PROJ[plan],c=calc(rows),all=PLANS.map(p=>calc(S.PROJ[p[0]]));
  const cell=(i,k,cls)=>`<td class="${cls||'n'}"><input ${k==='n'?'type="text"':'type="text" inputmode="decimal"'} data-proj="${plan}" data-i="${i}" data-k="${k}" value="${esc(rows[i][k])}"></td>`;
  return `<div class="card"><h2>${esc(PLANS.find(p=>p[0]===plan)[1])}: events each month</h2><div class="scroll"><table class="ptable">
    <tr><th>Event</th><th>Price</th><th>Guests per session</th><th>Sessions per month</th><th>Cost per guest</th><th>Other cost per session</th><th>Team hours per session</th><th>Profit per month</th><th></th></tr>
    ${rows.map((r,i)=>`<tr>${cell(i,'n','')}${cell(i,'price')}${cell(i,'guests')}${cell(i,'per')}${cell(i,'cpg')}${cell(i,'fixed')}${cell(i,'hrs')}<td data-rp="${i}">${signed(rowProfit(r))}</td><td><button class="x" data-act="delproj" data-id="${plan}" data-i="${i}" aria-label="Remove">&times;</button></td></tr>`).join('')}
   </table></div><button class="btn add" data-act="addproj" data-id="${plan}">Add an event</button>
   <p class="hint">Cost per guest covers food, drinks and materials. Team hours cover set up, the session and reset, for everyone involved.</p></div>
   <div id="pout">${projOut(plan)}</div>`}
function projOut(plan){const c=calc(S.PROJ[plan]),all=PLANS.map(p=>calc(S.PROJ[p[0]])),o=num(S.open);
  const k=(l,v)=>`<div class="kpi"><span class="sm plum">${l}</span><b>${v}</b></div>`;
  const line=(l,f)=>`<div>${l}</div>${all.map(a=>`<div>${f(a)}</div>`).join('')}`;
  return `<div class="kpis">${k('Income per month',baht(c.inc))}${k('Costs per month',baht(c.cost))}${k('Profit per month',`<span class="${c.profit<0?'neg':''}">${baht(c.profit)}</span>`)}${k('Profit per team hour',baht(c.perhr))}</div>
   <div class="card"><h2>Side by side</h2><div class="cmp"><div class="h"></div>${PLANS.map(p=>`<div class="h">${esc(p[1])}</div>`).join('')}
    ${line('Sessions per month',a=>fmt(a.ses))}${line('Team hours per month',a=>fmt(a.hrs))}${line('Income per month',a=>fmt(a.inc))}${line('Costs per month',a=>fmt(a.cost))}${line('Profit per month',a=>signed(a.profit))}${line('Profit per team hour',a=>signed(a.perhr))}${line('Profit per year, '+o+' open months',a=>signed(a.profit*o))}</div>
    <p class="hint">All figures in THB. Open months per year: <input type="text" inputmode="decimal" data-open="1" value="${esc(S.open)}" style="width:40px;border:0;border-bottom:1px solid var(--tan);background:transparent;text-align:center;outline:0"></p></div>
   <div class="band"><div><h3>Profit</h3><p>What is left each month after food, drinks and materials.</p></div><div><h3>Team hours</h3><p>Every session takes hours away from field work and from the kitchen.</p></div><div><h3>Profit per hour</h3><p>The fairest way to compare plans: what each hour of the team's time brings in.</p></div></div>`}
function projection(r){const plan=PLANS.some(p=>p[0]===r.a)?r.a:'jess';
  return header('projection')+`<main class="wrap fi">${head('Projection','What our events cost, what they earn, and what they ask of the team.')}
   <div class="plans">${PLANS.map(p=>`<a class="btn ${p[0]===plan?'on':''}" href="#/projection/${p[0]}">${esc(p[1])}</a>`).join('')}</div>
   <div id="proj">${projBody(plan)}</div><div class="foot">TEPA GARDEN</div></main>`}

function eventPage(r){
  const e=S.EV.find(x=>x.id===r.a); if(!e) return header('calendar')+`<main class="wrap">${head('Event not found','')}<p class="centre"><a class="btn" href="#/calendar">Back to the calendar</a></p></main>`;
  const tab=TABS.some(t=>t[0]===r.b)?r.b:'overview', t=S.TPL.find(x=>x.id===e.tpl)||S.TPL[0], m=pd(e.date).getMonth();
  return `<div class="detail fi">${header('calendar')}
   <div class="panel"><div class="eyebrow">${esc((e.series||t.kind).toUpperCase())}</div><h1>${esc(e.name)}</h1><p>${esc(nice(e.date))}${e.time?' · '+esc(e.time):''}${isDone(e)?' · Completed':''}</p></div>
   <div class="pane"><a class="back" href="#/calendar/${m}">${IC('arrow-left-dark')}Back</a><div id="tab">${tabBody(e,tab)}</div></div>
   <div class="bar">${TABS.map(x=>`<button type="button" class="${x[0]===tab?'on':''}" data-act="tab" data-id="${e.id}" data-t="${x[0]}">${x[1]}</button>`).join('')}</div></div>`}

const tile=(ic,label,inner)=>`<div class="tile"><div class="ic">${IC(ic)}</div><div style="flex:1;min-width:0"><label>${label}</label>${inner}</div></div>`;
const fld=(e,k,label)=>`<div class="f"><label>${label}</label><textarea rows="1" data-ev="${e.id}" data-k="${k}" placeholder="Not stated">${esc(k.includes('.')?e.notes[k.split('.')[1]]:e[k])}</textarea></div>`;
function dutyLine(e,list,i,cls){const d=e[list][i];return`<div class="line ${cls||''} ${d.st==='done'?'is-done':''}">
  ${cls==='mk'?'':`<input type="checkbox" data-chk="${list}" data-ev="${e.id}" data-i="${i}" ${d.st==='done'?'checked':''} aria-label="Done">`}
  <input type="text" data-ev="${e.id}" data-list="${list}" data-i="${i}" data-k="t" value="${esc(d.t)}" placeholder="What needs doing">
  <select class="p" data-ev="${e.id}" data-list="${list}" data-i="${i}" data-k="who">${opts(PEOPLE,d.who,'Unassigned')}</select>
  <select class="s st-${d.st}" data-ev="${e.id}" data-list="${list}" data-i="${i}" data-k="st">${opts(STATUS,d.st)}</select>
  <button class="x" data-act="del" data-ev="${e.id}" data-list="${list}" data-i="${i}" aria-label="Remove">&times;</button></div>`}
function tabBody(e,tab){
  if(tab==='overview') return `<div class="tiles">
     ${tile('seasonality','Date',`<input type="date" data-ev="${e.id}" data-k="date" value="${e.date}">`)}
     ${tile('category','Time',`<input type="text" data-ev="${e.id}" data-k="time" value="${esc(e.time)}" placeholder="Not stated">`)}
     ${tile('grower','Price (THB)',`<input type="text" data-ev="${e.id}" data-k="price" value="${esc(e.price)}" placeholder="Not stated">`)}
     ${tile('family','Guests',`<input type="text" data-ev="${e.id}" data-k="guests" value="${esc(e.guests)}" placeholder="Not stated">`)}</div>
    <div class="card">${fld(e,'name','Event name')}${fld(e,'series','Series')}${fld(e,'purpose','Purpose')}${fld(e,'audience','Who it is for')}${fld(e,'takehome','What guests take home')}</div>
    <p class="hint"><button class="link" data-act="delev" data-id="${e.id}">Remove this event</button></p>`;
  if(tab==='team'){const n=e.duties.filter(d=>d.st==='done').length;return `<div class="card"><h2>Team and duties</h2>${e.duties.map((d,i)=>dutyLine(e,'duties',i)).join('')||'<p class="hint" style="margin-top:0">No duties yet.</p>'}
     <button class="btn add" data-act="addline" data-ev="${e.id}" data-list="duties">Add a duty</button></div><p class="hint">${n} of ${e.duties.length} done</p>`}
  if(tab==='mise') return `<div class="card"><h2>Mise en place</h2><div class="sets">${S.SET.map(s=>`<button type="button" class="tcard ${e.sets.includes(s.id)?'on':''}" data-act="toggleset" data-ev="${e.id}" data-id="${s.id}"><div class="ic">${IC(s.icon)}</div><h3>${esc(s.name)}</h3><p class="sm plum">${e.sets.includes(s.id)?'Added':'Add'}</p></button>`).join('')}</div></div>
    ${e.sets.map(id=>{const s=S.SET.find(x=>x.id===id);if(!s)return'';return`<div class="card"><h2>${esc(s.name)}</h2>${s.items.map(it=>{const k=id+'|'+it;return`<label class="check"><input type="checkbox" data-pack="${esc(k)}" data-ev="${e.id}" ${e.packed[k]?'checked':''}><span>${esc(it)}</span></label>`}).join('')||`<p class="hint" style="margin-top:0">No items listed yet. <a class="link" href="#/mise/${id}">Add items</a></p>`}</div>`}).join('')}`;
  if(tab==='buy') return `<div class="card"><h2>To buy</h2><p class="hint" style="margin:-8px 0 10px">Only what needs buying for this event. Cost is the total for the line, in THB.</p>
     ${e.buy.map((b,i)=>`<div class="line buy ${b.got?'is-done':''}"><input type="checkbox" data-got="${i}" data-ev="${e.id}" ${b.got?'checked':''} aria-label="Bought"><input type="text" data-ev="${e.id}" data-list="buy" data-i="${i}" data-k="t" value="${esc(b.t)}" placeholder="Item"><input type="text" data-ev="${e.id}" data-list="buy" data-i="${i}" data-k="q" value="${esc(b.q)}" placeholder="Qty"><input type="text" inputmode="decimal" data-ev="${e.id}" data-list="buy" data-i="${i}" data-k="c" value="${esc(b.c)}" placeholder="Cost"><button class="x" data-act="del" data-ev="${e.id}" data-list="buy" data-i="${i}" aria-label="Remove">&times;</button></div>`).join('')||'<p class="hint" style="margin-top:0">Nothing to buy yet.</p>'}
     <button class="btn add" data-act="addline" data-ev="${e.id}" data-list="buy">Add an item</button></div>`;
  if(tab==='marketing'){const CH=['Instagram','TikTok','LINE'];return `<div class="card"><h2>What we need</h2>${e.mk.map((d,i)=>dutyLine(e,'mk',i,'mk')).join('')}<button class="btn add" data-act="addline" data-ev="${e.id}" data-list="mk">Add a need</button></div>
    <div class="card"><h2>Where it goes</h2><div class="chips">${CH.map(c=>`<button type="button" class="btn ${e.ch.includes(c)?'on':''}" data-act="ch" data-ev="${e.id}" data-id="${c}">${c}</button>`).join('')}</div></div>`}
  if(tab==='costs'){const spend=e.buy.reduce((a,b)=>a+num(b.c),0),p=num(e.price),g=num(e.guests),inc=p*g,be=p?Math.ceil(spend/p):0;return `<div class="card"><h2>Cost breakdown</h2>
     ${e.buy.filter(b=>b.t||b.c).map(b=>`<div class="tot"><span>${esc(b.t||'Item')}${b.q?' <span class="plum sm">x '+esc(b.q)+'</span>':''}</span><span>${b.c?baht(num(b.c)):'Not stated'}</span></div>`).join('')||'<p class="hint" style="margin-top:0">Add items under To buy and they total here.</p>'}
     <div class="tot big"><span>Spend</span><span>${baht(spend)}</span></div></div>
    <div class="card"><h2>If every seat is filled</h2><div class="tot"><span>Price per guest</span><span>${p?baht(p):'Free'}</span></div><div class="tot"><span>Guests</span><span>${g||'Not stated'}</span></div><div class="tot"><span>Income</span><span>${baht(inc)}</span></div><div class="tot"><span>Cost per guest</span><span>${g?baht(spend/g):'Not stated'}</span></div><div class="tot big"><span>Profit</span><span class="${inc-spend<0?'neg':''}">${baht(inc-spend)}</span></div>
     ${p?`<div class="tot"><span>Guests needed to cover the spend</span><span>${be}</span></div>`:''}</div>
    <p class="hint">Covers bought items only. Venue and staff time are not counted here. Change the numbers under To buy and Overview.</p>`}
  return `<div class="card"><h2>Notes</h2>${fld(e,'notes.came','How many guests came')}${fld(e,'notes.worked','What worked')}${fld(e,'notes.change','What to change next time')}</div>`}

/* ---------- render and events ---------- */
const app=document.getElementById('app');
function render(){const r=route();
  app.innerHTML=r.page==='event'?eventPage(r):r.page==='templates'?templates():r.page==='mise'?mise(r):r.page==='projection'?projection(r):calendar(r);
  grow()}
function grow(){document.querySelectorAll('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})}
function retab(){const r=route(),e=S.EV.find(x=>x.id===r.a),el=document.getElementById('tab');if(e&&el){el.innerHTML=tabBody(e,r.b||'overview');grow()}}
const EV=id=>S.EV.find(x=>x.id===id);

app.addEventListener('input',ev=>{const t=ev.target,d=t.dataset;
  if(t.tagName==='TEXTAREA'){t.style.height='auto';t.style.height=t.scrollHeight+'px'}
  if(d.proj){const r=S.PROJ[d.proj][+d.i];r[d.k]=t.value;save();const c=document.querySelector('[data-rp="'+d.i+'"]');if(c)c.innerHTML=signed(rowProfit(r));if(d.k!=='n')document.getElementById('pout').innerHTML=projOut(d.proj);return}
  if(d.open){S.open=t.value;save();return}
  if(d.set){S.SET.find(s=>s.id===d.set)[d.k]=t.value;save();return}
  if(d.setitem){S.SET.find(s=>s.id===d.setitem).items[+d.i]=t.value;save();return}
  if(!d.ev||t.type==='checkbox'||t.type==='date'||t.tagName==='SELECT')return;
  const e=EV(d.ev); if(d.list)e[d.list][+d.i][d.k]=t.value; else if(d.k.includes('.'))e.notes[d.k.split('.')[1]]=t.value; else e[d.k]=t.value; save()});
app.addEventListener('change',ev=>{const t=ev.target,d=t.dataset;
  if(d.open){render();return}
  if(!d.ev)return;const e=EV(d.ev);
  if(d.chk){e[d.chk][+d.i].st=t.checked?'done':'todo'}
  else if(d.pack){e.packed[d.pack]=t.checked;save();return}
  else if(d.got!==undefined){e.buy[+d.got].got=t.checked}
  else if(t.type==='date'){if(!t.value)return;e.date=t.value;save();render();return}
  else if(t.tagName==='SELECT'){e[d.list][+d.i][d.k]=t.value}
  else {if(d.k==='name'||d.k==='time'||d.k==='series')render();return}
  save();retab()});
app.addEventListener('click',ev=>{
  const a=ev.target.closest('a[href^="#/"]');
  if(a){ev.preventDefault();go(a.getAttribute('href').slice(1));return}
  const b=ev.target.closest('[data-act]');if(!b)return;const d=b.dataset,e=d.ev&&EV(d.ev);
  switch(d.act){
   case'menu':document.getElementById('mob').classList.toggle('open');return;
   case'tab':setHash('/event/'+d.id+'/'+d.t);document.querySelectorAll('.bar button').forEach(x=>x.classList.toggle('on',x===b));retab();try{window.scrollTo(0,0)}catch(err){}return;
   case'addline':e[d.list].push(d.list==='buy'?{t:'',q:'',c:'',got:false}:{t:'',who:'',st:'todo'});break;
   case'del':e[d.list].splice(+d.i,1);break;
   case'toggleset':e.sets.includes(d.id)?e.sets.splice(e.sets.indexOf(d.id),1):e.sets.push(d.id);break;
   case'ch':e.ch.includes(d.id)?e.ch.splice(e.ch.indexOf(d.id),1):e.ch.push(d.id);break;
   case'delev':if(d.sure){const m=pd(EV(d.id).date).getMonth();S.EV=S.EV.filter(x=>x.id!==d.id);save();go('/calendar/'+m)}else{b.dataset.sure=1;b.textContent='Click again to remove'}return;
   case'additem':S.SET.find(s=>s.id===d.id).items.push('');save();render();return;
   case'delitem':S.SET.find(s=>s.id===d.id).items.splice(+d.i,1);save();render();return;
   case'newset':{const id='s'+(S.seq++);S.SET.push({id,icon:'category',name:'New set',note:'',items:[]});save();go('/mise/'+id);return}
   case'addproj':S.PROJ[d.id].push(P('New event',0,0,1,0,0,0));save();render();return;
   case'delproj':S.PROJ[d.id].splice(+d.i,1);save();render();return;
   case'new':dialog(d.id);return;
   case'close':{const v=document.querySelector('.veil');if(v)v.remove();return}
   case'create':{const v=document.getElementById('nd').value;if(!v)return;const n=fromTpl(d.id,v);const nm=document.getElementById('nn').value.trim();if(nm)n.name=nm;S.EV.push(n);save();document.querySelector('.veil').remove();go('/event/'+n.id);return}
  }
  save();retab()});
function dialog(tid){const t=S.TPL.find(x=>x.id===tid);const v=document.createElement('div');v.className='veil fi';
  v.innerHTML=`<div class="dlg"><h2>${esc(t.name)}</h2><label>Event name</label><input id="nn" type="text" value="${esc(t.name)}"><label>Date</label><input id="nd" type="date" value="${YEAR}-01-01"><div class="acts"><button class="btn" data-act="close">Cancel</button><button class="btn on" data-act="create" data-id="${tid}">Add to calendar</button></div></div>`;
  app.appendChild(v)}
render();
</script>
</body>
</html>
